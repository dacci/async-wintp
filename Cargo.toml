[workspace]
members = ["threadpool"]

[package]
name = "async-wintp"
version = "0.1.0"
edition = "2024"
description = "An async runtime that uses Windows threadpool."
readme = "README.md"
repository = "https://github.com/dacci/async-wintp"
license = "MIT"

[dependencies]
pin-project-lite = "0.2.17"
thiserror = "2.0.21"
threadpool = { version = "*", path = "threadpool" }
windows-sys = { version = "0.61.2", optional = true }

[features]
fs = ["io", "windows-sys/Win32_Storage_FileSystem"]
io = ["threadpool/io"]
time = ["threadpool/timer"]
full = ["fs", "io", "time"]

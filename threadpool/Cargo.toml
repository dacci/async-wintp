[package]
name = "threadpool"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-result = "0.100.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[features]
io = ["windows-sys/Win32_System_IO"]
timer = []
sync = []

[dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem"] }
